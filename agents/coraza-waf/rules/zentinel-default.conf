# Zentinel starter ruleset for the Coraza WAF agent.
#
# This is a deliberately small, high-signal set for operators who do not have
# an existing ModSecurity ruleset to point at. It is NOT a replacement for the
# OWASP Core Rule Set — for real coverage, load CRS (or your panel's exported
# rules) instead of, or in addition to, this file:
#
#   coraza-waf --rules /etc/modsecurity.d/owasp-crs --rules /etc/modsecurity.d/custom
#
# Engine settings (SecRuleEngine, body limits, audit log) come from the agent's
# command-line flags and are loaded before this file, so any directive here
# overrides them.
#
# Rule IDs use the 100000-100999 range, which does not collide with CRS
# (900000-999999) or with ModSecurity's reserved ranges.

# --- Protocol hygiene -------------------------------------------------------

SecRule REQUEST_URI "@rx (?i)(?:\.\./|%2e%2e[/\\]|\.\.\\)" \
    "id:100001,phase:1,deny,status:403,log,\
    msg:'Path traversal sequence in request URI',\
    tag:'zentinel/waf',tag:'attack-lfi',severity:'CRITICAL'"

SecRule REQUEST_URI|REQUEST_HEADERS "@rx \x00" \
    "id:100002,phase:1,deny,status:400,log,\
    msg:'Null byte in request',\
    tag:'zentinel/waf',tag:'protocol-violation',severity:'CRITICAL'"

SecRule REQUEST_METHOD "@rx ^(?:TRACE|TRACK)$" \
    "id:100003,phase:1,deny,status:405,log,\
    msg:'Method %{MATCHED_VAR} not allowed',\
    tag:'zentinel/waf',tag:'protocol-violation',severity:'WARNING'"

# --- Injection --------------------------------------------------------------
# libinjection-backed operators: low false-positive rate, no regex tuning.

SecRule ARGS "@detectSQLi" \
    "id:100010,phase:2,deny,status:403,log,\
    msg:'SQL injection in %{MATCHED_VAR_NAME}',\
    logdata:'%{MATCHED_VAR}',\
    tag:'zentinel/waf',tag:'attack-sqli',severity:'CRITICAL'"

SecRule ARGS "@detectXSS" \
    "id:100011,phase:2,deny,status:403,log,\
    msg:'XSS payload in %{MATCHED_VAR_NAME}',\
    logdata:'%{MATCHED_VAR}',\
    tag:'zentinel/waf',tag:'attack-xss',severity:'CRITICAL'"

SecRule REQUEST_COOKIES "@detectSQLi" \
    "id:100012,phase:2,deny,status:403,log,\
    msg:'SQL injection in cookie %{MATCHED_VAR_NAME}',\
    tag:'zentinel/waf',tag:'attack-sqli',severity:'CRITICAL'"

# --- Shell / code execution -------------------------------------------------

SecRule ARGS "@rx (?i)(?:;|\||`|\$\()\s*(?:cat|wget|curl|nc|bash|sh|python|perl)\b" \
    "id:100020,phase:2,deny,status:403,log,\
    msg:'Command injection pattern in %{MATCHED_VAR_NAME}',\
    logdata:'%{MATCHED_VAR}',\
    tag:'zentinel/waf',tag:'attack-rce',severity:'CRITICAL'"

SecRule REQUEST_URI "@rx (?i)/(?:wp-config\.php|\.env|\.git/config|\.aws/credentials)(?:$|\?)" \
    "id:100021,phase:1,deny,status:404,log,\
    msg:'Request for sensitive file %{MATCHED_VAR}',\
    tag:'zentinel/waf',tag:'attack-disclosure',severity:'ERROR'"
