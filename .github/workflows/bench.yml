name: Bench Gate

# Regression gate for the request hot paths.
#
# Runs the production-representative benchmarks on the PR merge-base and the
# PR head back-to-back on the SAME runner, then fails if a gated hot path
# regressed by more than the threshold. Turns "production correctness beats
# feature breadth" into an enforced budget instead of a review-time hope
# (IDEAS.md #10).
#
# Gated benches (GATED_BENCHES in scripts/bench-gate.py):
#   - agent-protocol `full_request_path/json_path` — per-request agent call,
#     production JSON codec.
#   - proxy `route_match/{cache_hit,cache_miss}` — per-request routing
#     decision, LRU steady state and full-table evaluation.
#
# Why same-runner, back-to-back (not a stored/cross-run baseline):
# GitHub-hosted runners vary up to ~2x across CPU generations (Intel vs AMD).
# Comparing against a baseline captured in a *prior* run bakes that
# between-machine variance into the result -> flaky. Measuring base and head on
# one physical runner cancels it. No external action, no gh-pages state branch
# (Manifesto: no hidden control planes, no vendor lock-in).
#
# Scope control: each crate's bench only runs when the PR touches that crate
# (compiling the proxy for an agent-protocol-only PR would double the job for
# no signal). A PR touching only the gate itself (this file or the script)
# benches both crates so gate changes are exercised. bench-gate.py reports
# out-of-scope benches as skipped, not failed.
#
# Posture: generous hard-fail (20%). Microbenchmarks on shared CI are noisy; a
# tight gate cries wolf and gets muted, which is worse than no gate (Manifesto:
# calm, no surprises; repo rule: no flaky tests). Tune the threshold via
# BENCH_REGRESSION_THRESHOLD. To make the gate advisory instead of blocking, add
# `continue-on-error: true` to the "Evaluate regression gate" step.

on:
  pull_request:
    paths:
      - 'crates/agent-protocol/**'
      - 'crates/proxy/**'
      - 'scripts/bench-gate.py'
      - '.github/workflows/bench.yml'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the gate if a hot path regresses by more than this fraction.
  BENCH_REGRESSION_THRESHOLD: '0.20'
  # Criterion filters (regex over benchmark ids). Keep CI bounded to the gated
  # benches; must stay in sync with GATED_BENCHES in scripts/bench-gate.py.
  AGENT_BENCH_FILTER: 'full_request_path'
  PROXY_BENCH_FILTER: 'route_match'

jobs:
  bench-gate:
    name: Hot-path regression gate
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the PR base and head commits are both present.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Resolve merge-base
        id: base
        run: |
          BASE=$(git merge-base \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Merge-base: $BASE"

      - name: Detect bench scope
        id: scope
        run: |
          CHANGED=$(git diff --name-only \
            "${{ steps.base.outputs.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "$CHANGED"
          AGENT=false; PROXY=false
          grep -q '^crates/agent-protocol/' <<<"$CHANGED" && AGENT=true
          grep -q '^crates/proxy/' <<<"$CHANGED" && PROXY=true
          # Gate-only PR: exercise both so gate changes are actually tested.
          if [[ "$AGENT" == false && "$PROXY" == false ]]; then
            AGENT=true; PROXY=true
          fi
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
          echo "proxy=$PROXY" >> "$GITHUB_OUTPUT"
          echo "Bench scope: agent-protocol=$AGENT proxy=$PROXY"

      - name: Benchmark merge-base (save baseline)
        id: baseline
        run: |
          # The restored target/ cache may hold criterion results from a prior
          # run; stale comparison data would corrupt this run's verdicts and
          # defeat bench-gate.py's skipped-bench detection. Start clean.
          rm -rf target/criterion

          git checkout --quiet --detach "${{ steps.base.outputs.sha }}"
          if [[ "${{ steps.scope.outputs.agent }}" == "true" ]]; then
            cargo bench -p zentinel-agent-protocol --bench hot_path -- \
              --save-baseline base "$AGENT_BENCH_FILTER"
          fi
          PROXY_BASELINE=false
          if [[ "${{ steps.scope.outputs.proxy }}" == "true" ]]; then
            # The routing bench may not exist on an older merge-base (e.g. the
            # PR that introduces it). No baseline -> nothing to compare against;
            # the head bench is skipped too and the gate reports it as skipped.
            if cargo bench -p zentinel-proxy --bench routing -- --list >/dev/null 2>&1; then
              cargo bench -p zentinel-proxy --bench routing -- \
                --save-baseline base "$PROXY_BENCH_FILTER"
              PROXY_BASELINE=true
            else
              echo "routing bench absent on merge-base; skipping proxy gate"
            fi
          fi
          echo "proxy=$PROXY_BASELINE" >> "$GITHUB_OUTPUT"

      - name: Benchmark PR head (compare to baseline)
        run: |
          git checkout --quiet --detach "${{ github.event.pull_request.head.sha }}"
          if [[ "${{ steps.scope.outputs.agent }}" == "true" ]]; then
            cargo bench -p zentinel-agent-protocol --bench hot_path -- \
              --baseline base "$AGENT_BENCH_FILTER"
          fi
          if [[ "${{ steps.baseline.outputs.proxy }}" == "true" ]]; then
            cargo bench -p zentinel-proxy --bench routing -- \
              --baseline base "$PROXY_BENCH_FILTER"
          fi

      - name: Evaluate regression gate
        run: python3 scripts/bench-gate.py
